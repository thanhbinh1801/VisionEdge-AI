[pytest]
# Cố định rootdir về gốc repo và đưa gốc repo lên sys.path, để mọi module backend
# chỉ được nạp dưới một prefix duy nhất là `backend.*`. Nếu thiếu dòng này, chạy
# pytest từ backend/ sẽ nạp thêm bản sao `app.*` và monkeypatch trong test sẽ vá
# nhầm module object.
pythonpath = .
testpaths = backend/tests
